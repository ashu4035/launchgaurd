services:
  - type: web
    name: launchgaurd
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 22.22.2
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBFLOW_CLIENT_ID
        sync: false
      - key: WEBFLOW_CLIENT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
